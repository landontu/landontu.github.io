<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Landon Tu — personal website.">
  <title>Landon Tu</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="watercolor.css">
  <link rel="stylesheet" href="styles.css">
  <script src="site.js" defer></script>
</head>
<body class="home-page">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="watercolor" aria-hidden="true">
    <img id="wc-art-field" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" hidden>
    <img id="wc-art-fallback" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" hidden>
    <canvas id="wc-canvas"></canvas>
    <div class="watercolor-shade"></div>
    <!-- Scroll-driven hush: the wash is not stopped, it is settled. Opacity only,
         so the descent costs the compositor a blend and never a repaint. -->
    <div class="watercolor-veil"></div>
  </div>

  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Landon Tu, home">
      <span aria-hidden="true">LT</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <span class="nav-highlight" aria-hidden="true"></span>
      <!-- Nav order IS the scroll order. All three are same-document links, so
           the delegated handler in site.js:61 turns every one of them into a
           scroll; there is no page navigation left anywhere on this site. -->
      <a href="index.html" aria-current="page" class="nav-here">Home</a>
      <a href="#about" data-spy="about">About</a>
      <a href="#portfolio" data-spy="portfolio">Portfolio</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.4A8.5 8.5 0 0 1 8.6 4a8.5 8.5 0 1 0 11.4 11.4Z"/></svg>
    </button>
  </header>

  <main id="main-content">
    <section class="home-main" aria-label="Introduction">
      <!-- #hero carries the scroll parallax (transform/opacity); .hero-rise carries
           the one-shot load animation. Separate elements on purpose: a filled
           `rise` keyframe would otherwise pin the very properties the descent
           animates. -->
      <div class="hero" id="hero">
        <div class="hero-rise">
          <p class="eyebrow">Hello, I’m</p>
          <h1>Landon Tu</h1>
          <p class="hero-tagline">Coming soon</p>
          <div class="hero-actions">
            <a class="text-link" href="#about">About me <span aria-hidden="true">↓</span></a>
          </div>
        </div>
      </div>
      <a class="scroll-cue" href="#about">
        <span class="scroll-cue-label">Scroll</span>
        <span class="scroll-cue-rail" aria-hidden="true"><i></i></span>
      </a>
    </section>

    <section class="about-shell" id="about" aria-labelledby="about-heading">
     <div class="about-inner">
      <!-- No second <h1> and no repeat of the name: on one page the hero
           already said it, and during the descent both were on screen at once,
           which read as a duplicated heading rather than a transition. -->
      <header class="about-intro">
        <h2 class="about-display reveal" id="about-heading" style="--i:0">About</h2>
      </header>

      <div class="about-coming-soon reveal" style="--i:1">
        <p>Coming soon</p>
      </div>
     </div>
    </section>

    <!-- Third movement. Same sheet language as about, one level further down
         the descent: the about sheet's paper gradient has already reached its
         89% plateau by here, so this section holds exactly that value and the
         junction shows no seam. The card system below stays within the
         portfolio page's existing visual language. -->
    <section class="portfolio-shell" id="portfolio" aria-labelledby="portfolio-heading">
     <div class="portfolio-inner">
      <header class="portfolio-intro">
        <p class="eyebrow reveal" style="--i:0">Selected work</p>
        <h2 class="portfolio-display reveal" id="portfolio-heading" style="--i:1">Portfolio</h2>
      </header>

      <section class="portfolio-grid" aria-label="Portfolio exhibits">
        <!-- WebHome and recall-AID are deferred while their destinations are
             private. Restore their cards from git history once public links
             are approved. -->
        <article class="project-card reveal" style="--i:0">
          <a class="project-visual" href="https://www.desmos.com/calculator/bvrtbixju4">
            <img src="assets/projects/desmos-game.webp" width="1200" height="750" loading="lazy" decoding="async" alt="Desmos Quest title screen with a Play button">
          </a>
          <div class="project-meta">
            <h3><a href="https://www.desmos.com/calculator/bvrtbixju4">Desmos Quest</a></h3>
            <!-- Project description slot — owner copy pending. -->
          </div>
        </article>

        <article class="project-card reveal" style="--i:1">
          <a class="project-visual stones-visual" href="https://stones.landontu.dev" aria-label="Open Stones">
            <svg viewBox="0 0 1200 750" aria-hidden="true">
              <rect class="stones-board" x="300" y="90" width="600" height="570" rx="8"/>
              <path class="stones-lines" d="M390 180H810V570H390ZM480 270H720V480H480ZM300 375H900M600 90V660"/>
              <g class="stones-pieces">
                <circle cx="390" cy="180" r="25"/><circle cx="600" cy="180" r="25"/><circle cx="720" cy="270" r="25"/>
                <circle cx="480" cy="480" r="25"/><circle cx="600" cy="570" r="25"/><circle cx="810" cy="570" r="25"/>
              </g>
            </svg>
          </a>
          <div class="project-meta">
            <h3><a href="https://stones.landontu.dev">Stones</a></h3>
            <!-- Project description slot — owner copy pending. -->
          </div>
        </article>

        <article class="project-card reveal" style="--i:2">
          <a class="project-visual" href="index.html">
            <img src="assets/projects/personal-website.webp" width="1200" height="750" loading="lazy" decoding="async" alt="The Landon Tu personal website over its interactive watercolor background">
          </a>
          <div class="project-meta">
            <h3><a href="index.html">This site</a></h3>
            <!-- Project description slot — owner copy pending. -->
          </div>
        </article>
      </section>

      <footer class="site-footer"><a href="index.html">Landon Tu</a><span aria-hidden="true">·</span><span>2026</span></footer>
     </div>
    </section>
  </main>

  <p class="interaction-hint">Move your pointer to stir the wash</p>

  <!-- Classic scripts in dependency order: file:// compatible, no modules, no fetch.

       NO watercolor/panel.js, and no #wc-panel-mount to put it in. The sliders
       are the showcase's subject (watercolor.html), not this page's furniture:
       here the wash is the background of a personal site and the reader has no
       business being handed a fluid solver's knobs. main.js mounts a panel only
       if WCPanel is on the page, so this omission IS the switch — there is no
       hidden panel, no panel CSS (watercolor-panel.css is not linked either) and
       no panel bytes on the wire. `?tune` re-adds all of it on demand for a
       tuning pass; see watercolor/main.js. -->
  <script src="watercolor/settings.js"></script>
  <script src="watercolor/art-data.js"></script>
  <script src="watercolor/shaders.js"></script>
  <script src="watercolor/sim.js"></script>
  <script src="watercolor/main.js"></script>
</body>
</html>
